<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title></title>
<style>
  html,body{margin:0;height:100%;background:#0b0b0b;color:#ddd;font-family:system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
  input{padding:12px 14px;background:#161616;border:1px solid #2a2a2a;color:#eee;border-radius:6px;font-size:16px;outline:none}
  input:focus{border-color:#555}
  button{padding:11px 14px;background:#1f1f1f;border:1px solid #333;color:#eee;border-radius:6px;cursor:pointer;font-size:14px;letter-spacing:.02em}
  button:hover:not(:disabled){background:#262626}
  button:disabled{opacity:.5;cursor:default}
  #status{font-size:12px;color:#777;min-height:1.2em;text-align:center}
  .err{color:#c97a7a !important}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <input id="pw" type="password" autocomplete="current-password" autofocus required spellcheck="false" aria-label="Password">
  <button type="submit" id="go">Unlock</button>
  <div id="status" aria-live="polite"></div>
</form>
<script src="loader.js"></script>
</body>
</html>
